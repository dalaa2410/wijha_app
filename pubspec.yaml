name: wijha_app
description: "A new Flutter project."

publish_to: 'none' # Remove this line if you wish to publish to pub.dev


version: 1.0.0+1

environment:
  sdk: ^3.8.1


dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_bloc: ^9.1.1
  go_router: ^17.0.0
  google_fonts: ^6.3.2
  intl: ^0.20.2
  equatable: ^3.0.0
  dio: ^5.11.1
  flutter_secure_storage: ^10.3.4
  get_it: ^9.3.0
  webview_flutter: ^4.13.1
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter


  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4


flutter:


  uses-material-design: true


  assets:
    - assets/images/
    - assets/mock/
    
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/logo.png"
  min_sdk_android: 21
  adaptive_icon_background: "#FFFFFF" # لون خلفية الأيقونة الدائرية على أندرويد (يمكنك تغييره للون اللوغو مثل #1A237E)
  adaptive_icon_foreground: "assets/images/logo.png"